name: PR Baseline Checks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node and pinned npm
        uses: ./.github/actions/setup-node-pinned-npm

      - name: Validate runtime
        run: npm run env:check

      - name: Run lints
        run: npm run lint:all

      - name: Check Cursor rule mirror
        run: npm run sync:cursor-rules -- --check

      - name: Run tests
        run: npm run test

      - name: Secret scan
        run: npm run check:secrets
