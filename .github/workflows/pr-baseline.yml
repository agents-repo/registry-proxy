name: PR Baseline Checks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node and pinned npm
        uses: ./.github/actions/setup-node-pinned-npm

      - name: Validate runtime
        run: npm run env:check

      - name: Run lints
        run: npm run lint:all

      - name: Check IDE instruction mirrors
        run: npm run sync:ide-instructions -- --check

      - name: Verify registry package installs match lockfile
        run: |
          rm -rf .github/agents .cursor/skills .claude/agents .agents/skills
          npx agents-repo@1.13.0 install
          DRIFT_PATHS="agents.json agents-lock.json .github/agents .cursor/skills .claude/agents .agents/skills"
          git diff --exit-code -- $DRIFT_PATHS
          test -z "$(git status --porcelain -- $DRIFT_PATHS)"

      - name: Run tests
        run: npm run test

      - name: Secret scan
        run: npm run check:secrets
