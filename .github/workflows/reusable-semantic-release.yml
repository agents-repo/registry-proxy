name: Reusable semantic release

on:
  workflow_call:
    inputs:
      mode:
        description: semantic-release mode (dry-run or publish)
        required: true
        type: string
    secrets:
      GITHUB_TOKEN:
        required: true

jobs:
  semantic-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Bootstrap registry proxy CI
        uses: ./.github/actions/proxy-ci-bootstrap
        with:
          validate-runtime: 'false'

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ inputs.mode }}" = "dry-run" ]; then
            npm run release:dry-run
          elif [ "${{ inputs.mode }}" = "publish" ]; then
            npm run release
          else
            echo "Unsupported mode: ${{ inputs.mode }}"
            exit 1
          fi
