name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run semantic-release in dry-run mode
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Release Inputs
    runs-on: ubuntu-latest
    steps:
      - name: Bootstrap registry proxy CI
        uses: ./.github/actions/proxy-ci-bootstrap

      - name: Run baseline checks
        run: npm run lint:all

      - name: Run tests
        run: npm run test

      - name: Secret scan
        run: npm run check:secrets

  release-dry-run:
    name: Release Dry Run
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs:
      - validate
    permissions:
      contents: read
    steps:
      - name: Bootstrap registry proxy CI
        uses: ./.github/actions/proxy-ci-bootstrap
        with:
          fetch-depth: '0'
          validate-runtime: 'false'

      - name: Run semantic-release dry run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release:dry-run

  release-publish:
    name: Publish GitHub Release
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'false' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    needs:
      - validate
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Bootstrap registry proxy CI
        uses: ./.github/actions/proxy-ci-bootstrap
        with:
          fetch-depth: '0'
          validate-runtime: 'false'

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release
